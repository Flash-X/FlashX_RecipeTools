; OpenACC device views.  A Milhoja wrapper already selects one tile, so these
; views are rank four and ignore the arithmetic block index.  Simple same-rank
; pointer association is supported in NVHPC device routines; physical indexing
; is retained explicitly through each view's origin instead of pointer bounds
; remapping, which requires an unavailable NVHPC device runtime template.

field_types
definition=
  type :: cell_field
    real(rk), pointer :: values(:,:,:,:) => null()
    integer :: origin(3)=1
  end type
  type :: flux_direction
    real(rk), pointer :: values(:,:,:,:) => null()
    integer :: origin(3)=1
  end type
  type :: flux_field
    type(flux_direction) :: directions(2)
  end type

cell_ref
args=data,var,block,ix,jy,kz
definition=${data}%values(${ix}-${data}%origin(1)+1,${jy}-${data}%origin(2)+1,${kz}-${data}%origin(3)+1,${var})

face_ref
args=data,var,block,dir,ix,jy,kz
definition=${data}%directions(${dir})%values(${ix}-${data}%directions(${dir})%origin(1)+1,${jy}-${data}%directions(${dir})%origin(2)+1,${kz}-${data}%directions(${dir})%origin(3)+1,${var})

flat_ref
args=data,block,ix,jy,kz
definition=@cell_ref(${data},1,${block},${ix},${jy},${kz})@

allocate_cell
args=data,nvar,lo,hi,nblock
definition=
  allocate(${data}%values(${hi}(1)-${lo}(1)+1,${hi}(2)-${lo}(2)+1, &
                          ${hi}(3)-${lo}(3)+1,${nvar}))
  ${data}%origin=${lo}

allocate_flux
args=data,nvar,lo,hi,ndim,nblock
scope=block
declarations=
  integer :: direction
definition=
  do direction=1,ndim
    allocate(${data}%directions(direction)%values( &
      ${hi}(1)-${lo}(1)+1,${hi}(2)-${lo}(2)+1, &
      ${hi}(3)-${lo}(3)+1,${nvar}))
    ${data}%directions(direction)%origin=${lo}
  end do

release_cell
args=data
definition=
  if (associated(${data}%values)) deallocate(${data}%values)

release_flux
args=data
scope=block
declarations=
  integer :: direction
definition=
  do direction=1,size(${data}%directions)
    if (associated(${data}%directions(direction)%values)) &
      deallocate(${data}%directions(direction)%values)
  end do
