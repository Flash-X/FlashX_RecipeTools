; OpenACC device views with the component index unit-stride.  See the
; variable-last device binding for the rationale behind rank-four views and
; explicit physical origins.

field_types
definition=
  type :: cell_field
    real(rk), pointer :: values(:,:,:,:) => null()
    integer :: origin(3)=1
  end type
  type :: flux_direction
    real(rk), pointer :: values(:,:,:,:) => null()
    integer :: origin(3)=1
  end type
  type :: flux_field
    type(flux_direction) :: directions(2)
  end type

cell_ref
args=data,var,block,ix,jy,kz
definition=${data}%values(${var},${ix}-${data}%origin(1)+1,${jy}-${data}%origin(2)+1,${kz}-${data}%origin(3)+1)

face_ref
args=data,var,block,dir,ix,jy,kz
definition=${data}%directions(${dir})%values(${var},${ix}-${data}%directions(${dir})%origin(1)+1,${jy}-${data}%directions(${dir})%origin(2)+1,${kz}-${data}%directions(${dir})%origin(3)+1)

flat_ref
args=data,block,ix,jy,kz
definition=@cell_ref(${data},1,${block},${ix},${jy},${kz})@

allocate_cell
args=data,nvar,lo,hi,nblock
definition=
  allocate(${data}%values(${nvar},${hi}(1)-${lo}(1)+1, &
                          ${hi}(2)-${lo}(2)+1,${hi}(3)-${lo}(3)+1))
  ${data}%origin=${lo}

allocate_flux
args=data,nvar,lo,hi,ndim,nblock
scope=block
declarations=
  integer :: direction
definition=
  do direction=1,ndim
    allocate(${data}%directions(direction)%values( &
      ${nvar},${hi}(1)-${lo}(1)+1,${hi}(2)-${lo}(2)+1, &
      ${hi}(3)-${lo}(3)+1))
    ${data}%directions(direction)%origin=${lo}
  end do

release_cell
args=data
definition=
  if (associated(${data}%values)) deallocate(${data}%values)

release_flux
args=data
scope=block
declarations=
  integer :: direction
definition=
  do direction=1,size(${data}%directions)
    if (associated(${data}%directions(direction)%values)) &
      deallocate(${data}%directions(direction)%values)
  end do
