; Milhoja HOSTMEM variable-first DataPacket views. The component index is
; unit-stride, followed by spatial indices and the batched tile/block index.

field_types
definition=
  type :: cell_field
    real(rk), pointer :: values(:,:,:,:,:) => null()
  end type
  type :: flux_direction
    real(rk), pointer :: values(:,:,:,:,:) => null()
  end type
  type :: flux_field
    type(flux_direction), allocatable :: directions(:)
  end type

cell_ref
args=data,var,block,ix,jy,kz
definition=${data}%values(${var},${ix},${jy},${kz},${block})

face_ref
args=data,var,block,dir,ix,jy,kz
definition=${data}%directions(${dir})%values(${var},${ix},${jy},${kz},${block})

flat_ref
args=data,block,ix,jy,kz
definition=@cell_ref(${data},1,${block},${ix},${jy},${kz})@

allocate_cell
args=data,nvar,lo,hi,nblock
definition=
  allocate(${data}%values(${nvar},${lo}(1):${hi}(1),${lo}(2):${hi}(2), &
                         ${lo}(3):${hi}(3),${nblock}))

allocate_flux
args=data,nvar,lo,hi,ndim,nblock
scope=block
declarations=
  integer :: direction
definition=
  allocate(data%directions(ndim))
  do direction=1,ndim
    allocate(data%directions(direction)%values( &
      nvar,lo(1):hi(1),lo(2):hi(2),lo(3):hi(3), &
      nblock))
  end do

release_cell
args=data
definition=
  if (associated(${data}%values)) deallocate(${data}%values)

release_flux
args=data
scope=block
declarations=
  integer :: direction
definition=
  if (allocated(data%directions)) then
    do direction=1,size(data%directions)
      if (associated(data%directions(direction)%values)) &
        deallocate(data%directions(direction)%values)
    end do
    deallocate(data%directions)
  end if
